name: cristofer-portfolio
services:
  portfolio:
    build:
      context: .
      target: development
    ports:
      - '${PORTFOLIO_BIND_HOST:-127.0.0.1}:${PORT:-5173}:5173'
    environment:
      VITE_USE_POLLING: 'true'
    volumes:
      - .:/app
      - dependencies:/app/node_modules
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  dependencies:
